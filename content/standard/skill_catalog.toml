# Declarative skill catalog — batch generation input for gen_skill_dsl.py
# Templates expand into standard .skill DSL. Engine hard-code skills stay markers.

[templates.damage_draw]
# trigger damage owner_is_target { effect draw_cards(self, N); }
kind = "damage_draw"
dsl = """
skill {name}({id}) {{
  trigger damage owner_is_target {{
    effect draw_cards(self, {n});
  }}
}}
"""

[templates.phase_end_draw]
kind = "phase_end_draw"
dsl = """
skill {name}({id}) {{
  trigger phase_end owner_is_target optional {{
    effect draw_cards(self, {n});
  }}
}}
"""

[templates.modifier_add]
kind = "modifier_add"
dsl = """
skill {name}({id}) {{
  modifier {target} add {n};
}}
"""

[templates.view_as]
kind = "view_as"
dsl = """
skill {name}({id}) {{
  view_as {as_kind} {window} {filter};
}}
"""

[templates.cards_moved_draw]
kind = "cards_moved_draw"
dsl = """
skill {name}({id}) {{
  trigger cards_moved {filter} optional {{
    effect draw_cards(self, {n});
  }}
}}
"""

[templates.card_used_draw]
kind = "card_used_draw"
dsl = """
skill {name}({id}) {{
  trigger card_used {filter} optional {{
    effect draw_cards(self, {n});
  }}
}}
"""

[templates.marker_active]
kind = "marker_active"
dsl = """
skill {name}({id}) {{
  active play_phase {{
    effect emit_note({id});
  }}
}}
"""

