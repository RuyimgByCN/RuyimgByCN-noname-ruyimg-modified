[package]
name = "desktop-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri 2 desktop shell and capability-gated host bridge"
default-run = "noname-next-desktop"

[features]
default = []
tauri-shell = ["dep:tauri"]

[[bin]]
name = "noname-next-desktop"
path = "src/main.rs"
required-features = ["tauri-shell"]

[dependencies]
content-runtime = { path = "../../crates/content-runtime" }
diagnostics = { path = "../../crates/diagnostics" }
engine-api = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tauri = { version = "2", optional = true, features = ["protocol-asset"] }
engine-native-wasm = { path = "../../crates/engine-native-wasm" }
tokio = { version = "1", features = ["sync", "rt", "macros"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
content-schema = { path = "../../crates/content-schema" }
rule-vm = { path = "../../crates/rule-vm" }
blake3 = { workspace = true }
engine-native = { path = "../../crates/engine-native" }
